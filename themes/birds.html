<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birds</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: linear-gradient(to bottom, #DFE8F4 0%, #EFF3F9 55%, #E7EDF6 100%);
  }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<script>
/* A murmuration: classic boids (separation, alignment, cohesion) plus a
   roaming falcon the flock flees from, which is what produces the sharp
   coordinated turns of a real starling cloud. Canvas 2D, zero deps. */
(() => {
  const canvas = document.getElementById('gl');
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(2, devicePixelRatio || 1);
  let W = 0, H = 0;

  function resize() {
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  const N = 260;
  const birds = [];
  for (let i = 0; i < N; i++) {
    const a = Math.random() * Math.PI * 2;
    birds.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: Math.cos(a) * 2, vy: Math.sin(a) * 2
    });
  }

  /* the falcon wanders on a slow noise-ish path and dives now and then */
  const falcon = { x: W * .3, y: H * .3, t: 0 };

  const VIEW = 46, SEP = 17, MAXV = 3.4, MINV = 1.6;
  const W_SEP = .055, W_ALI = .045, W_COH = .0055, W_FLEE = .12, FLEE_R = 120;

  /* spatial grid so 260 birds stay cheap */
  const CELL = VIEW;
  function step() {
    falcon.t += .0035;
    falcon.x = W * (.5 + .38 * Math.sin(falcon.t * 1.7) * Math.cos(falcon.t * .6));
    falcon.y = H * (.45 + .3 * Math.sin(falcon.t * 1.1 + 1.7));

    const grid = new Map();
    birds.forEach((b, i) => {
      const k = ((b.x / CELL) | 0) + ':' + ((b.y / CELL) | 0);
      (grid.get(k) || grid.set(k, []).get(k)).push(i);
    });

    for (const b of birds) {
      let sx = 0, sy = 0, ax = 0, ay = 0, cx = 0, cy = 0, n = 0;
      const gx = (b.x / CELL) | 0, gy = (b.y / CELL) | 0;
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
        const cell = grid.get((gx + dx) + ':' + (gy + dy));
        if (!cell) continue;
        for (const j of cell) {
          const o = birds[j];
          if (o === b) continue;
          const ddx = o.x - b.x, ddy = o.y - b.y;
          const d2 = ddx * ddx + ddy * ddy;
          if (d2 > VIEW * VIEW) continue;
          n++;
          cx += o.x; cy += o.y;
          ax += o.vx; ay += o.vy;
          if (d2 < SEP * SEP && d2 > 0) {
            const d = Math.sqrt(d2);
            sx -= ddx / d; sy -= ddy / d;
          }
        }
      }
      if (n) {
        b.vx += W_SEP * sx + W_ALI * (ax / n - b.vx) + W_COH * (cx / n - b.x);
        b.vy += W_SEP * sy + W_ALI * (ay / n - b.vy) + W_COH * (cy / n - b.y);
      }
      /* flee the falcon: the whole neighbourhood snaps away together */
      const fx = b.x - falcon.x, fy = b.y - falcon.y;
      const fd2 = fx * fx + fy * fy;
      if (fd2 < FLEE_R * FLEE_R && fd2 > 1) {
        const fd = Math.sqrt(fd2);
        b.vx += W_FLEE * (fx / fd) * (1 - fd / FLEE_R) * 6;
        b.vy += W_FLEE * (fy / fd) * (1 - fd / FLEE_R) * 6;
      }
      /* soft walls: turn back inside the sky */
      const M = 60, TURN = .18;
      if (b.x < M) b.vx += TURN; if (b.x > W - M) b.vx -= TURN;
      if (b.y < M) b.vy += TURN; if (b.y > H - M) b.vy -= TURN;

      const v = Math.hypot(b.vx, b.vy) || 1;
      const cl = v > MAXV ? MAXV / v : v < MINV ? MINV / v : 1;
      b.vx *= cl; b.vy *= cl;
      b.x += b.vx; b.y += b.vy;
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(24, 30, 40, .88)';
    for (const b of birds) {
      const v = Math.hypot(b.vx, b.vy) || 1;
      const ux = b.vx / v, uy = b.vy / v;
      /* a swallow-ish dart: nose ahead, two swept wing points behind */
      ctx.beginPath();
      ctx.moveTo(b.x + ux * 5, b.y + uy * 5);
      ctx.lineTo(b.x - ux * 3 - uy * 2.6, b.y - uy * 3 + ux * 2.6);
      ctx.lineTo(b.x - ux * 1.2, b.y - uy * 1.2);
      ctx.lineTo(b.x - ux * 3 + uy * 2.6, b.y - uy * 3 - ux * 2.6);
      ctx.closePath();
      ctx.fill();
    }
  }

  (function loop() {
    step();
    draw();
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
