<!DOCTYPE html><meta charset="utf-8"><title>xmb interaction tests</title>
<style>body{font:13px/1.5 monospace;background:#111;color:#ddd;padding:16px}
iframe{position:absolute;left:-9999px;width:1440px;height:900px;border:0}</style>
<iframe id="f" src="/?skip"></iframe>
<pre id="out">running…</pre>
<script>
const log = [];
const say = (name, got, want) =>
  log.push(`${String(got) === String(want) ? 'PASS' : 'FAIL'}  ${name}: got "${got}" want "${want}"`);

document.getElementById('f').onload = () => setTimeout(async () => {
  const f = document.getElementById('f');
  const w = f.contentWindow, d = f.contentDocument;

  const wait = () => new Promise(r => setTimeout(r, 130));
  const press = k => w.dispatchEvent(new w.KeyboardEvent('keydown', { key: k, bubbles: true }));
  const cat   = () => d.querySelector('.cat.is-on .cat__label').textContent;
  const item  = () => d.querySelector('.item.is-on .item__name').textContent;
  const hero  = () => d.querySelector('.hero__title').textContent;
  const key   = () => d.documentElement.style.getPropertyValue('--key').trim();
  const nItems= () => d.querySelectorAll('.item').length;

  /* --- the two axes --- */
  say('starts on ABOUT', cat(), 'ABOUT');
  say('about has 3 items', nItems(), 3);

  press('ArrowRight'); await wait();
  say('right moves category', cat(), 'WORK');
  say('work has 5 items', nItems(), 5);
  say('first job selected', item(), 'VISTIQ.AI');
  say('hero follows item', hero(), 'VISTIQ.AI');
  say('key colour follows', key(), '#2F6BFF');

  press('ArrowDown'); await wait();
  say('down moves item', item(), 'AXA FRANCE');
  say('hero follows down', hero(), 'AXA FRANCE');
  say('colour follows down', key(), '#1B34C8');
  say('category unchanged', cat(), 'WORK');

  press('ArrowDown'); press('ArrowDown'); await wait();
  say('down x2', item(), 'MATHCO');

  press('ArrowUp'); await wait();
  say('up moves back', item(), 'EXL SERVICES');

  /* --- each category remembers its own item --- */
  press('ArrowRight'); await wait();
  say('right to PLAY', cat(), 'PLAY');
  say('play has 8 items', nItems(), 8);
  press('ArrowDown'); await wait();
  say('play item 2', item(), 'MEMORY BRIDGEAI');
  say('badge renders', d.querySelector('.hero__badge').textContent.includes('MISSION PASSED'), 'true');
  say('action href', d.querySelector('.btn').getAttribute('href').includes('linkedin.com'), 'true');

  press('ArrowLeft'); await wait();
  say('back to WORK', cat(), 'WORK');
  say('WORK remembered its item', item(), 'EXL SERVICES');

  press('ArrowRight'); await wait();
  say('PLAY remembered its item', item(), 'MEMORY BRIDGEAI');

  /* --- the long category --- */
  for (let i = 0; i < 3; i++) { press('ArrowRight'); await wait(); }
  say('reached CONTACT', cat(), 'CONTACT');
  press('ArrowLeft'); await wait();
  say('back to TROPHIES', cat(), 'TROPHIES');
  press('ArrowLeft'); await wait();
  say('PEOPLE has 16 items', nItems(), 16);

  /* --- clamping --- */
  for (let i = 0; i < 25; i++) press('ArrowDown');
  await wait();
  say('item clamps at end', item(), 'DEVESH SINGH');
  for (let i = 0; i < 25; i++) press('ArrowUp');
  await wait();
  say('item clamps at start', item(), 'PHILIPPE FRAISSE');

  /* --- category wraps, matching a console bar --- */
  for (let i = 0; i < 3; i++) { press('ArrowRight'); await wait(); }
  say('category wraps past the end', cat(), 'ABOUT');

  /* --- clicking --- */
  d.querySelectorAll('.cat')[4].click(); await wait();
  say('click selects category', cat(), 'TROPHIES');
  d.querySelectorAll('.item')[2].click(); await wait();
  say('click selects item', item(), '2');

  /* --- no logo file exists yet, so every mark must fall back cleanly --- */
  d.querySelectorAll('.cat')[1].click(); await wait();
  await new Promise(r => setTimeout(r, 400));
  const ka = d.getElementById('keyart').textContent.trim();
  const selectedMark = d.querySelector('.item.is-on .item__glyph').textContent.trim();
  say('key art matches the selected item', ka, selectedMark);
  say('key art holds exactly one mark', d.getElementById('keyart').childNodes.length, 1);
  say('no stray logo images left', d.querySelectorAll('#keyart img').length, 0);

  /* --- the cross must actually cross: the item column hangs directly under
         the active category's icon, at every category --- */
  /* Compare LAYOUT values, never rendered ones: mid-transition a rect returns
     an intermediate position, which made an earlier version of this test
     report failures the code was not actually producing. offsetLeft ignores
     transforms, and the inline transform holds the settled target. */
  const crossAt = async name => {
    const idx = [...d.querySelectorAll('.cat')].findIndex(
      c => c.querySelector('.cat__label').textContent === name);
    d.querySelectorAll('.cat')[idx].click();
    await new Promise(r => setTimeout(r, 250));

    const bar  = d.getElementById('bar');
    const cat  = d.querySelector('.cat.is-on');
    const barX = parseFloat((bar.style.transform.match(/-?[\d.]+/) || [0])[0]);
    const categoryX = cat.offsetLeft + barX;          // where the icon settles
    const columnX = parseFloat(
      w.getComputedStyle(d.documentElement).getPropertyValue('--crossx')) || 0;
    const itemY = parseFloat((d.getElementById('columnTrack').style.transform
      .match(/-?[\d.]+/) || [0])[0])
      + d.querySelector('.item.is-on').offsetTop;     // selected row's settled y
    const rowH = parseFloat(
      w.getComputedStyle(d.documentElement).getPropertyValue('--row')) || 0;
    /* first item sits flush under the category; any later item parks one
       reserved row down with the previous box fading above it */
    const els = [...d.querySelectorAll('.item')];
    const wantY = els.findIndex(el => el.classList.contains('is-on')) === 0 ? 0 : rowH;

    log.push(`      ${name}: categoryX=${categoryX.toFixed(1)} columnX=${columnX.toFixed(1)} `
           + `itemY=${itemY.toFixed(1)} (want ${wantY.toFixed(1)})`);
    return { ok: Math.abs(categoryX - columnX) <= 1 && Math.abs(itemY - wantY) <= 1,
             categoryX, itemY };
  };
  const crosses = {};
  for (const n of ['ABOUT', 'WORK', 'PLAY', 'PEOPLE', 'CONTACT']) {
    crosses[n] = await crossAt(n);
    say(`column aligns under ${n}`, crosses[n].ok, 'true');
  }
  /* first category: whole cross flush at the gutter; all others share one
     crosspoint exactly one category-slot in */
  say('first category parks flush at the gutter', Math.abs(crosses.ABOUT.categoryX) <= 1, 'true');
  const rest = ['WORK', 'PLAY', 'PEOPLE', 'CONTACT'].map(n => crosses[n].categoryX.toFixed(0));
  say('one shared crosspoint for every later category', new Set(rest).size, 1);
  say('later crosspoint is one slot in (not flush)', crosses.WORK.categoryX > 40, 'true');
  /* walk deep into PEOPLE: the selected row must park one reserved row down
     at every index — the box above it is the one you came from */
  d.querySelectorAll('.cat')[3].click(); await wait();
  for (let i = 0; i < 7; i++) press('ArrowDown');
  await new Promise(r => setTimeout(r, 250));
  const track = d.getElementById('columnTrack');
  const rowH2 = parseFloat(
    w.getComputedStyle(d.documentElement).getPropertyValue('--row')) || 0;
  const deepY = parseFloat((track.style.transform.match(/-?[\d.]+/) || [0])[0])
    + d.querySelector('.item.is-on').offsetTop;
  say('selected row parks one row down at depth', Math.abs(deepY - rowH2) <= 1, 'true');
  /* and the reserved row above holds the previous item, not a random one */
  const items = [...d.querySelectorAll('.item')];
  const onIdx = items.findIndex(el => el.classList.contains('is-on'));
  const aboveY = items[onIdx - 1].offsetTop
    + parseFloat((track.style.transform.match(/-?[\d.]+/) || [0])[0]);
  say('previous item occupies the reserved row', Math.abs(aboveY) <= 1, 'true');
  /* back at the first item: flush under the category, no gap, no top fade */
  for (let i = 0; i < 25; i++) press('ArrowUp');
  await new Promise(r => setTimeout(r, 250));
  const headY = parseFloat((track.style.transform.match(/-?[\d.]+/) || [0])[0])
    + d.querySelector('.item.is-on').offsetTop;
  say('first item sits flush, no reserved gap', Math.abs(headY) <= 1, 'true');
  say('top fade removed at the first item',
      d.getElementById('column').classList.contains('column--athead'), 'true');

  const fails = log.filter(l => l.startsWith('FAIL')).length;
  document.getElementById('out').textContent =
    log.join('\n') + `\n\n${log.length - fails}/${log.length} passed`;
}, 800);
</script>
