<h1>Abhishek Thomas</h1>
<p>AI engineer in Paris, France. LLM evaluation, retrieval augmented generation (RAG), AI agents and document intelligence. Five years of data science shipped to production. This is his personal site, hiabhi.com, also called HiAbhi. His handle is dcrey7.</p>
<p>The site is an interactive menu in the style of a game console. The facts below are the same facts the site shows.</p>
<h2>About</h2>
<ul>
<li>Traditional and generative AI, from credit risk and fraud detection to document intelligence and computer vision: he has shipped all of it.</li>
<li>Local models and open source: he builds with them, runs and tests them on his own GPU, and contributes back.</li>
<li>Digital illustration and print design: the prints on his clothes are his own drawings.</li>
<li>Arsenal supporter, and football every Saturday in Paris, where he films his own games.</li>
</ul>
<h2>Work</h2>
<ul>
<li>Vistiq.AI, AI Engineer, Paris, since 2026: document extraction accuracy from 44% to 92% on private equity and venture capital documents, an LLM evaluation system wired into CI/CD, LLM inference cost cut by 40%, and an agent that uses MCP connectors.</li>
<li>AXA France, Data Scientist, Paris, 2025 to 2026.</li>
<li>EXL Services, Senior Data Scientist, Bangalore, 2022 to 2024.</li>
<li>MathCo, Data Scientist, Bangalore, 2021 to 2022.</li>
<li>Amazon, Risk Analyst, Bangalore, 2019 to 2021.</li>
</ul>
<h2>Education</h2>
<ul>
<li>emlyon business school, Paris: MSc Data Science and Artificial Intelligence, 2024 to 2026. Class delegate. Thesis: Active GLiNER, active learning for span based entity extraction.</li>
<li>McGill University, Montreal: international semester, 2025.</li>
<li>SVNIT Surat (Sardar Vallabhbhai National Institute of Technology), India: B.Tech Mechanical Engineering, 2015 to 2019. Captain of the university football team.</li>
</ul>
<h2>Products he builds</h2>
<ul>
<li><a href="https://rezoume.com/">rezoume</a>: build a personal resume with AI.</li>
<li><a href="https://tranzlato.com/">tranzlato</a>: AI language tutor for real conversation practice.</li>
<li><a href="https://kickyai.com/">Kicky AI</a>: a personal AI coach for your football shooting form.</li>
<li><a href="https://recolli.com/">Recolli AI</a>: a daily call that remembers. It calls elderly parents on any phone, remembers each conversation, and tells the family when something changes. It grew out of Memory BridgeAI, his Speechmatics hackathon winner.</li>
</ul>
<h2>Projects and awards</h2>
<ul>
<li>Memory BridgeAI: Speechmatics hackathon, winner of three awards. Now becoming Recolli AI, at recolli.com.</li>
<li>NOTME: Mistral game jam, finalist.</li>
<li>Medical RAG: Mistral and Alan hackathon, finalist.</li>
<li>Pika Pal AI: WiDS datathon, Thales responsible AI award.</li>
<li>Cover Switch 2: open source window switcher for KDE Plasma.</li>
<li>Active GLiNER: research, masters thesis.</li>
<li>Cerebras Community Ambassador for Paris.</li>
</ul>
<h2>Certifications</h2>
<p>AWS Machine Learning Specialty, AWS Cloud Practitioner, Google Cloud skills badge, Generative AI with LLMs (DeepLearning.AI), Cohere.</p>

<ul>

</ul>
