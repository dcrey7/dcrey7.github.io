<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HiAbhi</title>
<meta name="description" content="Abhishek Thomas, AI engineer in Paris. LLM evals, RAG, agents. Five years turning data science into shipped systems.">
<meta property="og:title" content="HiAbhi">
<meta property="og:description" content="A portfolio built as a console cross media bar: categories across, items down.">
<meta property="og:image" content="https://hiabhi.com/assets/afaicon.png">
<meta property="og:url" content="https://hiabhi.com/">
<meta name="theme-color" content="#08090B">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="assets/afaicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@300;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body class="booting">

<div class="field" aria-hidden="true"></div>
<div class="keyart" id="keyart" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <time class="clock" id="clock"></time>
  <div class="sys">
    <div class="settings">
      <button class="gear" id="searchBtn" aria-label="Search" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      </button>
      <div class="themenu themenu--search" id="searchPanel" hidden>
        <input id="searchInput" type="search" placeholder="SEARCH EVERYTHING" autocomplete="off" spellcheck="false">
        <div id="searchResults"></div>
      </div>
    </div>
    <div class="settings">
      <button class="gear" id="langBtn" aria-label="Language" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm7.93 9h-3.02a15.7 15.7 0 0 0-1.2-5.15A8.03 8.03 0 0 1 19.93 11zM12 4.04c.86 1.26 1.55 3.06 1.87 4.96h-3.74c.32-1.9 1.01-3.7 1.87-4.96zM4.26 13h3.02c.16 1.83.58 3.6 1.2 5.15A8.03 8.03 0 0 1 4.26 13zm3.02-2H4.26a8.03 8.03 0 0 1 4.22-5.15A15.7 15.7 0 0 0 7.28 11zM12 19.96c-.86-1.26-1.55-3.06-1.87-4.96h3.74c-.32 1.9-1.01 3.7-1.87 4.96zM14.12 13h-4.24a20 20 0 0 1 0-2h4.24a20 20 0 0 1 0 2zm.4 5.15c.62-1.55 1.04-3.32 1.2-5.15h3.02a8.03 8.03 0 0 1-4.22 5.15z"/></svg>
      </button>
      <div class="themenu" id="langMenu" hidden>
        <span class="themenu__head">LANGUAGE</span>
        <button data-lang="">ENGLISH</button>
        <button data-lang="fr">FRANCAIS</button>
        <button data-lang="de">DEUTSCH</button>
        <button data-lang="es">ESPANOL</button>
        <button data-lang="it">ITALIANO</button>
        <button data-lang="pt">PORTUGUES</button>

      </div>
    </div>
    <div class="settings">
      <button class="gear" id="modeBtn" aria-label="Light mode">
        <svg id="modeSun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM11 1h2v3h-2zm0 19h2v3h-2zM3.5 4.9 4.9 3.5l2.1 2.1-1.4 1.4zm13.5 13.6 1.4-1.4 2.1 2.1-1.4 1.4zM1 11h3v2H1zm19 0h3v2h-3zM3.5 19.1l2.1-2.1 1.4 1.4-2.1 2.1zM17 5.6l2.1-2.1 1.4 1.4-2.1 2.1z"/></svg>
        <svg id="modeMoon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="display:none"><path fill="currentColor" d="M12.3 2a9.9 9.9 0 0 0-2.6.36 10 10 0 0 1 0 19.28A10 10 0 1 0 12.3 2z"/></svg>
      </button>
    </div>
    <div class="settings">
      <button class="gear" id="gearBtn" aria-label="Settings" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.23.41.47.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
      </button>
      <div class="themenu" id="themenu" hidden>
        <span class="themenu__head">THEME</span>
        <button data-theme="default">ROYAL BLUE</button>
        <button data-theme="beach">BEACH</button>
        <button data-theme="lava">LAVA LAMP</button>
        <button data-theme="space">SPACE</button>
      </div>
    </div>
    <span class="who">
      <img src="assets/afaicon.png" alt="">
      <span class="who__names"><b>ABHISHEK</b><i>@dcrey7</i></span>
    </span>
  </div>
</header>

<div id="radio-host" aria-hidden="true"></div>

<div class="pill" id="pill" hidden>
  <img class="pill__disc" id="pillDisc" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="">
  <div class="pill__meta">
    <span class="pill__line">
      <span id="pillTimeCur">0:00</span>
      <span class="pill__title" id="pillTitleWrap"><span id="pillTitle">…</span></span>
      <span id="pillTimeTot">0:00</span>
    </span>
    <span class="pill__bar"><i id="pillProg"></i></span>
    <span class="pill__ctl">
      <button class="pill__btn" id="pillPrev" aria-label="Previous">⏮</button>
      <button class="pill__btn pill__btn--main" id="pillPlay" aria-label="Play"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M4 2l10 6-10 6z" fill="currentColor"/></svg></button>
      <button class="pill__btn" id="pillNext" aria-label="Next">⏭</button>
    </span>
  </div>
</div>

<main class="xmb">

  <!-- horizontal axis: categories -->
  <div class="barwrap">
    <div class="reflbar" id="reflbar" aria-hidden="true"></div>
    <div class="bar" id="bar" role="tablist" aria-label="Categories"></div>
  </div>

  <!-- the cross: vertical axis on the left, detail on the right -->
  <div class="cross">
    <div class="column" id="column" aria-label="Items">
      <div class="column__track" id="columnTrack"></div>
    </div>

    <div class="detail">
      <section class="hero" id="hero" aria-live="polite"></section>
      <div class="shelf" id="shelf" aria-label="Details"></div>
    </div>
  </div>

</main>

<div class="boot" id="boot">
  <img class="boot__mark" src="assets/afaicon.png" alt="afaicon — hand-drawn yellow smiley">
  <h1 class="boot__title">ABHISHEK THOMAS</h1>
  <p class="boot__sub">AI ENGINEER · PARIS</p>
  <div class="loadbar" aria-hidden="true"><i id="bar-fill"></i></div>
  <button class="boot__start" id="start">PRESS ANY KEY</button>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
