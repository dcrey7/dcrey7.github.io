<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abhishek in 3D</title>
<style>
  /* The viewer needs its controls in the DOM. The site does not want to see
     them, so they stay present and hidden rather than removed. */
  * { box-sizing: border-box }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden }
  header, aside, #camera-tools, .overlay { display: none !important }
  main, section { height: 100%; width: 100% }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab }
  canvas:active { cursor: grabbing }
  #shade {
    position: fixed; inset: 0; display: grid; place-items: center;
    font: 600 12px/1 system-ui, sans-serif; letter-spacing: .14em;
    color: rgba(255,255,255,.72); background: transparent;
    transition: opacity .5s ease; pointer-events: none;
  }
  #shade.gone { opacity: 0 }
  /* An author display rule beats the hidden attribute, so say it here. */
  #shade[hidden] { display: none }
</style>

<main>
  <aside>
    <button id="computer"></button><button id="dance"></button>
    <button id="smoke"></button><button id="drink"></button>
    <button id="eat"></button><button id="jump-kick"></button>
    <button id="vault"></button>
    <select id="prop"><option value=""></option></select>
    <small id="prop-note"></small>
    <p id="progress"></p>
    <input id="search" type="search">
    <select id="category"><option value=""></option></select>
    <select id="motion"></select>
    <button id="perform"></button><button id="previous"></button>
    <button id="next"></button><button id="pause"></button>
    <button id="home"></button>
    <input id="showcase" type="checkbox">
    <input id="skeleton" type="checkbox">
    <input id="ground" type="checkbox" checked>
    <input id="travel" type="checkbox">
    <input id="speed" type="range" min="0.2" max="1.5" step="0.1" value="1">
    <input id="timeline" type="range" min="0" max="1" step="0.016667" value="0">
    <p id="detail"></p>
    <div id="bindings"></div>
    <a id="download"></a>
  </aside>
  <section>
    <canvas tabindex="0" aria-label="Abhishek in 3D, drag to rotate"></canvas>
    <div class="overlay"><strong id="current"></strong><p id="error"></p></div>
  </section>
</main>

<div id="shade">LOADING</div>

<script type="module" src="viewer.js?v=embed-1"></script>
<script type="module" src="embed.js?v=embed-1"></script>
